name: windows-release

# Windows release paths, both built on a GitHub-hosted Windows runner from the
# commit the workflow runs on (github.sha), never from a caller-supplied ref.
#
# store-msix (the active route). Builds and tests the release bundle with
# Klipa's vetted media runtime, then packages an unsigned MSIX for Microsoft
# Store submission: the Store signs packages after certification, so nothing
# is signed and nothing is published here. The MSIX is a workflow artifact
# that the maintainer uploads in Partner Center. By default the job also
# installs a throwaway, test-signed copy on the runner, starts it through its
# package identity, checks the zero-network start and removes it again.
# The Store identity comes from packaging/windows/msix/store-identity.json,
# or from the dispatch inputs below. While that file holds placeholders the
# package is built for validation only and its artifact name says so.
#
# build-sign-release (inactive). The SignPath route for a signed direct
# download. The SignPath Foundation declined the project on 2026-07-22 (see
# docs/code-signing-policy.md), so this job runs only when the repository
# variable SIGNPATH_ENABLED is 'true'. Its pre-conditions, all on the
# SignPath side:
#   * SignPath project slug "klipa-player" exists and is linked to this repo
#   * Signing policy "release-signing" with origin verification on main + tags/v*
#   * Artifact configurations "windows-appfiles" and "windows-installer"
#     registered (matching .signpath/artifact-configurations/)
#   * GitHub secrets set: SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID
#   * SignPath GitHub App installed on the org/repo (recommended)
#
# Both paths use Klipa's source-built, LGPL-profile media runtime (libmpv),
# never the DLL downloaded by the media_kit_libs_windows_video pub package.
# windows-media-runtime.yml builds it with tool/build_windows_media.sh; the
# maintainer uploads the reviewed bundle to the MEDIA_RUNTIME_RELEASE_TAG
# release, and tool/fetch_windows_media.ps1 refuses any download that does not
# match the hashes pinned in third_party/windows-media/. See
# docs/supply-chain.md and the media runtime gate in docs/release-checklist.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Store Package/Identity/Name (blank: store-identity.json)'
        required: false
        type: string
        default: ''
      publisher:
        description: 'Store Package/Identity/Publisher, CN=... (blank: store-identity.json)'
        required: false
        type: string
        default: ''
      publisher_display_name:
        description: 'Store Package/Properties/PublisherDisplayName (blank: store-identity.json)'
        required: false
        type: string
        default: ''
      smoke_install:
        description: 'Install a test-signed copy on the runner, start it and remove it'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.6'
  MEDIA_RUNTIME_RELEASE_TAG: media-runtime-v1
  SIGNPATH_PROJECT_SLUG: klipa-player
  SIGNPATH_SIGNING_POLICY_SLUG: release-signing
  SIGNPATH_APPFILES_CONFIGURATION_SLUG: windows-appfiles
  SIGNPATH_INSTALLER_CONFIGURATION_SLUG: windows-installer

jobs:
  store-msix:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Stage vetted Windows media runtime
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: tool\fetch_windows_media.ps1 -Repository $env:REPOSITORY -Tag $env:MEDIA_RUNTIME_RELEASE_TAG

      - name: Build and test Windows release bundle
        shell: pwsh
        run: tool\build_windows.ps1 -Configuration release

      - name: Check the media runtime plays HTTPS with TLS verification
        shell: pwsh
        run: tool\probe_windows_libmpv.ps1

      - name: Package Store MSIX
        id: msix
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ inputs.identity_name }}
          PUBLISHER: ${{ inputs.publisher }}
          PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: |
          $package = @{ SkipBuild = $true; AllowPlaceholderIdentity = $true }
          if ($env:IDENTITY_NAME) { $package.IdentityName = $env:IDENTITY_NAME }
          if ($env:PUBLISHER) { $package.Publisher = $env:PUBLISHER }
          if ($env:PUBLISHER_DISPLAY_NAME) { $package.PublisherDisplayName = $env:PUBLISHER_DISPLAY_NAME }
          tool\package_msix.ps1 @package
          $identity = Get-Content -LiteralPath 'dist\windows-store\identity.json' -Raw | ConvertFrom-Json
          $suffix = ''
          if ($identity.placeholderIdentity) {
            $suffix = '-PLACEHOLDER-IDENTITY'
            "::warning::Store identity is a placeholder: this MSIX validates the build and cannot be submitted. Fill packaging/windows/msix/store-identity.json from Partner Center."
          }
          "version=$($identity.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "suffix=$suffix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content -LiteralPath 'dist\windows-store\SHA256SUMS.txt'

      - name: Smoke test a test-signed copy
        if: github.event_name != 'workflow_dispatch' || inputs.smoke_install
        shell: pwsh
        env:
          # The test playlist of the commit being built, so the screenshots
          # never depend on anything outside this repository's history.
          PLAYLIST: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/packaging/windows/store/certification-test.m3u
        run: tool\smoke_windows_msix.ps1 -RunAppCert -CaptureScreenshots -ScreenshotPlaylist $env:PLAYLIST

      - name: Upload Store MSIX
        if: always() && steps.msix.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-store-msix-${{ steps.msix.outputs.version }}${{ steps.msix.outputs.suffix }}-${{ github.run_id }}
          path: |
            dist/windows-store/*.msix
            dist/windows-store/SHA256SUMS.txt
            dist/windows-store/AppxManifest.xml
            dist/windows-store/identity.json
            dist/windows-store/probe/
            dist/windows-store/smoke/
          if-no-files-found: error
          retention-days: 90

  build-sign-release:
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve build ref
        id: ref
        shell: pwsh
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          # Only a pushed v* tag publishes; the commit built is always the one
          # the workflow runs on (github.sha), never a caller-supplied ref.
          $ref = $env:EVENT_REF
          $publish = 'false'
          $tag = ''
          if ($ref -like 'refs/tags/v*') {
            $publish = 'true'
            $tag = $ref -replace '^refs/tags/',''
          }
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 install failed' }

      - name: Stage vetted Windows media runtime
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: tool\fetch_windows_media.ps1 -Repository $env:REPOSITORY -Tag $env:MEDIA_RUNTIME_RELEASE_TAG

      - name: Build Windows release bundle
        shell: pwsh
        run: tool\build_windows.ps1 -Configuration release

      - name: Stage unsigned application executable
        id: appstage
        shell: pwsh
        run: |
          $bundle = Join-Path $env:USERPROFILE 'develop\klipa-player-windows-native\build\windows\x64\runner\Release'
          $exe = Join-Path $bundle 'klipa_player.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          New-Item -ItemType Directory -Path unsigned-app -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination unsigned-app
          "bundle=$bundle" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload unsigned executable for SignPath origin verification
        id: upload-unsigned-app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-appfiles-unsigned-${{ github.run_id }}
          path: unsigned-app
          if-no-files-found: error
          retention-days: 7

      - name: Submit application signing request to SignPath
        id: signpath-app
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_APPFILES_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '900'
          output-artifact-directory: signed-app

      - name: Restore signed executable into the release bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.appstage.outputs.bundle }}
        run: |
          $signed = Join-Path 'signed-app' 'klipa_player.exe'
          if (-not (Test-Path -LiteralPath $signed)) { throw 'Signed klipa_player.exe missing' }
          Copy-Item -LiteralPath $signed -Destination (Join-Path $env:BUNDLE 'klipa_player.exe') -Force

      - name: Package installer and portable ZIP from signed files
        id: pkg
        shell: pwsh
        run: |
          tool\package_windows.ps1 -SkipBuild
          $dist = 'dist\windows'
          $setup    = Join-Path $dist 'KlipaPlayer-Setup-x64.exe'
          $portable = Join-Path $dist 'KlipaPlayer-Portable-x64.zip'
          if (-not (Test-Path -LiteralPath $setup))    { throw "Missing $setup" }
          if (-not (Test-Path -LiteralPath $portable)) { throw "Missing $portable" }
          "setup=$((Resolve-Path $setup).Path)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portable=$((Resolve-Path $portable).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage unsigned installer into SignPath upload root
        shell: pwsh
        env:
          SETUP: ${{ steps.pkg.outputs.setup }}
        run: |
          New-Item -ItemType Directory -Path unsigned-installer -Force | Out-Null
          Copy-Item -LiteralPath $env:SETUP -Destination unsigned-installer
          Get-ChildItem -LiteralPath unsigned-installer | Format-Table Name,Length

      - name: Upload unsigned installer for SignPath origin verification
        id: upload-unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-unsigned-${{ github.run_id }}
          path: unsigned-installer
          if-no-files-found: error
          retention-days: 7

      - name: Submit installer signing request to SignPath
        id: signpath-installer
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '900'
          output-artifact-directory: signed-installer

      - name: Assemble release artifacts and SHA256SUMS
        shell: pwsh
        env:
          PORTABLE: ${{ steps.pkg.outputs.portable }}
        run: |
          $out = 'release'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $setup = Get-ChildItem -LiteralPath 'signed-installer' -Filter 'KlipaPlayer-Setup-x64.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Signed installer missing' }
          Copy-Item -LiteralPath $setup.FullName -Destination $out
          Copy-Item -LiteralPath $env:PORTABLE -Destination $out
          Copy-Item -LiteralPath 'LICENSE' -Destination $out
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination $out
          $hashLines = foreach ($a in Get-ChildItem -LiteralPath $out -File | Sort-Object Name) {
            $h = (Get-FileHash -LiteralPath $a.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h *$($a.Name)"
          }
          $sums = Join-Path $out 'SHA256SUMS.txt'
          $hashLines | Set-Content -LiteralPath $sums -Encoding ascii
          Get-Content -LiteralPath $sums

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.run_id }}
          path: release
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed artifacts to GitHub Release
        if: steps.ref.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          $notes = "Windows release for $env:TAG.`n`nSigned via SignPath. See docs/code-signing-policy.md."
          gh release create $env:TAG --verify-tag --notes $notes `
            'release/KlipaPlayer-Setup-x64.exe' `
            'release/KlipaPlayer-Portable-x64.zip' `
            'release/LICENSE' `
            'release/THIRD_PARTY_NOTICES.md' `
            'release/SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $env:TAG" }
