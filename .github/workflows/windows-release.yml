name: windows-release

# Builds the Windows release bundle on a GitHub-hosted Windows runner,
# submits the unsigned installer + portable archive to SignPath for
# Authenticode signing, then publishes the signed artifacts to a GitHub
# Release on the triggering tag.
#
# Pre-conditions (one-time, on the SignPath side — see docs/code-signing-policy.md):
#   * SignPath project slug "klipa-player" exists and is linked to this repo
#   * Signing policy "release-signing" with origin verification on main + tags/v*
#   * Artifact configuration "windows-release" registered (matches
#     .signpath/artifact-configurations/windows-release.xml)
#   * GitHub secrets set: SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID
#   * SignPath GitHub App installed on the org/repo (recommended)
#   * Vetted libmpv-2.dll + libmpv-2.dll.sha256 published as a GitHub
#     Release asset under the tag in MEDIA_RUNTIME_RELEASE_TAG below.
#     These are produced locally by tool/build_windows_media.sh
#     --archive-source and uploaded once; the build script verifies their
#     SHA-256 before assembling the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and sign
        required: true
        default: main

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.6'
  MEDIA_RUNTIME_RELEASE_TAG: media-runtime-v1
  SIGNPATH_PROJECT_SLUG: klipa-player
  SIGNPATH_SIGNING_POLICY_SLUG: release-signing
  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: windows-release

jobs:
  build-sign-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve build ref
        id: ref
        shell: pwsh
        run: |
          $ref = '${{ github.event.inputs.ref }}'
          if (-not $ref) { $ref = '${{ github.ref }}' }
          "value=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 0

      - name: Fetch vetted Windows media runtime
        shell: pwsh
        run: |
          $tag = '${{ env.MEDIA_RUNTIME_RELEASE_TAG }}'
          $mediaRoot = 'dist\windows-media\current'
          New-Item -ItemType Directory -Path $mediaRoot -Force | Out-Null
          foreach ($a in 'libmpv-2.dll','libmpv-2.dll.sha256') {
            $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$a"
            $dst = Join-Path $mediaRoot $a
            Invoke-WebRequest -Uri $url -OutFile $dst -SkipHttpErrorCheck
            if (-not (Test-Path -LiteralPath $dst) -or (Get-Item $dst).Length -eq 0) {
              throw "Failed to fetch $a from release tag $tag"
            }
          }
          $expected = ((Get-Content -LiteralPath (Join-Path $mediaRoot 'libmpv-2.dll.sha256') -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath (Join-Path $mediaRoot 'libmpv-2.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Vetted media runtime hash mismatch: expected $expected got $actual"
          }
          Write-Host "Vetted media runtime restored and verified for $tag"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 install failed' }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows release bundle
        shell: pwsh
        run: tool\build_windows.ps1 -Configuration release

      - name: Package unsigned installer and portable ZIP
        id: pkg
        shell: pwsh
        run: |
          tool\package_windows.ps1 -SkipBuild
          $dist = 'dist\windows'
          $setup    = Join-Path $dist 'KlipaPlayer-Setup-x64.exe'
          $portable = Join-Path $dist 'KlipaPlayer-Portable-x64.zip'
          if (-not (Test-Path -LiteralPath $setup))    { throw "Missing $setup" }
          if (-not (Test-Path -LiteralPath $portable)) { throw "Missing $portable" }
          "setup=$((Resolve-Path $setup).Path)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portable=$((Resolve-Path $portable).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage unsigned artifacts into SignPath upload root
        shell: pwsh
        run: |
          $stage = 'unsigned'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath '${{ steps.pkg.outputs.setup }}'    -Destination $stage
          Copy-Item -LiteralPath '${{ steps.pkg.outputs.portable }}' -Destination $stage
          Get-ChildItem -LiteralPath $stage | Format-Table Name,Length

      - name: Upload unsigned artifact for SignPath origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-${{ github.run_id }}
          path: unsigned
          if-no-files-found: error
          retention-days: 7

      - name: Submit signing request to SignPath
        id: signpath
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '900'
          output-artifact-directory: signed

      - name: Recompute SHA256SUMS over signed artifacts
        id: sums
        shell: pwsh
        run: |
          $signed = 'signed'
          if (-not (Test-Path -LiteralPath $signed)) { throw "Signed artifact directory missing: $signed" }
          $setup    = Get-ChildItem -LiteralPath $signed -Filter 'KlipaPlayer-Setup-x64.exe'   -File | Select-Object -First 1
          $portable = Get-ChildItem -LiteralPath $signed -Filter 'KlipaPlayer-Portable-x64.zip' -File | Select-Object -First 1
          if (-not $setup)    { throw 'Signed installer missing' }
          if (-not $portable) { throw 'Signed portable archive missing' }
          $hashLines = foreach ($a in @($setup.FullName, $portable.FullName)) {
            $h = (Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h *$(Split-Path -Leaf $a)"
          }
          $sums = Join-Path $signed 'SHA256SUMS.txt'
          $hashLines | Set-Content -LiteralPath $sums -Encoding ascii
          "setup=$((Resolve-Path $setup.FullName).Path)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portable=$((Resolve-Path $portable.FullName).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sums=$((Resolve-Path $sums).Path)"                  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content -LiteralPath $sums

      - name: Publish signed artifacts to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ref = '${{ steps.ref.outputs.value }}'
          $tag = $ref -replace '^refs/tags/',''
          $notes = "Windows release for $tag.`n`nSigned via SignPath. See docs/code-signing-policy.md."
          gh release create $tag --verify-tag --notes $notes `
            '${{ steps.sums.outputs.setup }}' `
            '${{ steps.sums.outputs.portable }}' `
            '${{ steps.sums.outputs.sums }}'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $tag" }